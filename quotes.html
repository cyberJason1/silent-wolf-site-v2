<!-- quotes.html 金句库页面 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>金句库 · 沉默之狼 V5.5</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .quote-page-lead{text-align:center;margin-bottom:48px;color:var(--mute);}
        .quote-big{
            border-left:4px solid var(--ac);
            padding:22px 26px;
            margin:28px 0;
            background:linear-gradient(90deg, rgba(var(--ac),0.08), transparent);
            font-size:1.25rem;
            line-height:2.1;
            color:var(--tx);
        }
    </style>
</head>
<body data-page="quotes.html">
<main>
    <h1 class="fade">核心金句 &amp; 台词摘录</h1>
    <p class="lead quote-page-lead">来自《沉默之狼 · 第一卷：看见结构的人》</p>

    <div class="quote-big fade">眼睛会骗人。结构不会。</div>
    <div class="quote-big fade">你踢你的。我看得见。</div>
    <div class="quote-big fade">我记得你就够了。</div>
    <div class="quote-big fade">夜，我见过。你别来。</div>
    <div class="quote-big fade">你往亮的地方踢。</div>
    <div class="quote-big fade">他不是影子。他是天狼。</div>
    <div class="quote-big fade">又没好好吃饭？球踢得那么好，饭也要好好吃。——你的场外观众</div>

</main>
<script src="script.js"></script>
</body>
</html>
